<!DOCTYPE html>
<html>
<head>
    <title>AliExpress Product Search</title>
</head>
<body>
    <h1>Search Products from AliExpress</h1>
    <form method="get">
        <input type="text" name="q" value="{{ query }}" placeholder="Search for products...">
        <button type="submit">Search</button>
    </form>

    {% if products %}
        <ul>
            {% for product in products %}
                <li>
                    <img src="{{ product.image }}" width="100" alt="Product Image">
                    <p><strong>{{ product.title }}</strong></p>
                    <p>Price: ${{ product.price }}</p>
                    <a href="{{ product.url }}" target="_blank">View on AliExpress</a>
                </li>
            {% endfor %}
        </ul>
    {% elif query %}
        <p>No products found for "{{ query }}".</p>
    {% endif %}
</body>
</html>
